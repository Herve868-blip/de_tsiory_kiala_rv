version: '3.1'
services:
  db:
    image: postgres:12
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: Herv
    volumes:
      - pgdata:/var/lib/postgresql/data
  odoo:
    image: odoo:12.0
    depends_on:
      - db
    ports:
      - "8069:8069"
    volumes:
      - odoo-data:/var/lib/odoo
      - ./:/mnt/extra-addons
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
volumes:
  pgdata:
  odoo-data:
